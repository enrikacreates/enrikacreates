    <text x="522" y="271">Billing</text>
    <text x="522" y="343">Thank you</text>
    <text x="902" y="127">Welcome</text>
    <text x="902" y="199">Profile setup</text>
    <text x="1226" y="127">Dashboard</text>
    <text x="1226" y="199">Where to next</text>
    <text x="1548" y="127">Living Room</text>
    <text x="1548" y="199">Challenges</text>
    <text x="1548" y="271">Live Studio</text>
    <text x="1548" y="343">Maker Rooms</text>
    <text x="1548" y="415">What's On</text>
    <text x="1548" y="487">Pods</text>
    <text x="1828" y="127">I Made It! Wall</text>
