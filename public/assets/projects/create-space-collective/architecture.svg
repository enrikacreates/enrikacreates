<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900"
     font-family="Inter, -apple-system, sans-serif">
  <!--
    Create Space, information architecture as of 2026-10-03.

    Dated on purpose: the app is actively being built, and an undated
    architecture diagram goes quietly wrong without anyone noticing. Pods and
    Paths are drawn dashed because they are planned rather than shipped.

    The vertical gate is the point of the drawing. Everything left of it is
    reachable without an account and everything right of it is a room you have
    been let into, which is the product's whole shape: a door, then rooms.
  -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-size="19" fill="#8A7E72" letter-spacing="1.8">
    <text x="60" y="64">PUBLIC</text>
    <text x="392" y="64">ENROLL</text>
    <text x="772" y="64">FIRST RUN</text>
    <text x="1096" y="64">HOME</text>
    <text x="1420" y="64">ROOMS</text>
  </g>

  <!-- the gate -->
  <path d="M716 36 L716 540" stroke="#FC815B" stroke-width="1.6" stroke-dasharray="8 6" fill="none" stroke-linecap="round"/>
  <text x="716" y="572" text-anchor="middle" font-size="19" fill="#FC815B" font-style="italic">account required</text>

  <g stroke="#1A1A1A" stroke-width="1.6" fill="#FBF7EF" stroke-linejoin="round">
    <rect x="60" y="92" width="260" height="56" rx="10"/>
    <rect x="60" y="164" width="260" height="56" rx="10"/>
    <rect x="60" y="236" width="260" height="56" rx="10"/>
    <rect x="60" y="308" width="260" height="56" rx="10"/>
    <rect x="392" y="92" width="260" height="56" rx="10"/>
    <rect x="392" y="164" width="260" height="56" rx="10"/>
    <rect x="392" y="236" width="260" height="56" rx="10"/>
    <rect x="392" y="308" width="260" height="56" rx="10"/>
    <rect x="772" y="92" width="260" height="56" rx="10"/>
    <rect x="772" y="164" width="260" height="56" rx="10"/>
    <rect x="1096" y="92" width="260" height="56" rx="10"/>
    <rect x="1096" y="164" width="260" height="56" rx="10"/>
    <rect x="1420" y="92" width="256" height="56" rx="10"/>
    <rect x="1420" y="164" width="256" height="56" rx="10"/>
    <rect x="1420" y="236" width="256" height="56" rx="10"/>
    <rect x="1420" y="308" width="256" height="56" rx="10"/>
    <rect x="1420" y="380" width="256" height="56" rx="10"/>
    <rect x="1700" y="92" width="256" height="56" rx="10"/>
    <rect x="1700" y="164" width="256" height="56" rx="10"/>
    <rect x="1700" y="236" width="256" height="56" rx="10"/>
    <rect x="1700" y="308" width="256" height="56" rx="10"/>
  </g>

  <!-- planned, not shipped -->
  <g stroke="#1A1A1A" stroke-width="1.6" fill="#FBF7EF" stroke-dasharray="7 5" stroke-linejoin="round">
    <rect x="1420" y="452" width="256" height="56" rx="10"/>
    <rect x="1700" y="380" width="256" height="56" rx="10"/>
  </g>
  <text x="1420" y="534" font-size="17" fill="#FC815B" font-style="italic">dashed: planned, not shipped</text>

  <g font-size="21" fill="#1A1A1A" text-anchor="middle">
    <text x="190" y="127">Landing</text>
    <text x="190" y="199">Our Story</text>
    <text x="190" y="271">Values</text>
    <text x="190" y="343">Letters</text>
