    <path d="M656 190 L766 150" marker-end="url(#a)"/>
    <path d="M1036 130 L1090 125" marker-end="url(#a)"/>
    <path d="M1360 150 L1414 200" marker-end="url(#a)"/>
    <path d="M1360 150 L1414 300" marker-end="url(#a)"/>
  </g>

  <!-- the layer everything sits on -->
  <path d="M60 612 L1956 612" stroke="#8A7E72" stroke-width="1.2" stroke-dasharray="4 5" fill="none"/>
  <text x="60" y="656" font-size="19" fill="#8A7E72" letter-spacing="1.8">DATA AND SERVICES</text>

  <g stroke="#1A1A1A" stroke-width="1.6" fill="#FBF7EF" stroke-linejoin="round">
    <rect x="60" y="692" width="352" height="92" rx="10"/>
    <rect x="444" y="692" width="352" height="92" rx="10"/>
    <rect x="828" y="692" width="352" height="92" rx="10"/>
    <rect x="1212" y="692" width="352" height="92" rx="10"/>
    <rect x="1596" y="692" width="360" height="92" rx="10"/>
  </g>
  <g font-size="21" fill="#1A1A1A" text-anchor="middle">
    <text x="236" y="730">Supabase Postgres</text>
    <text x="620" y="730">Auth, SSR cookies</text>
    <text x="1004" y="730">Cloudflare R2</text>
    <text x="1388" y="730">Postmark</text>
    <text x="1776" y="730">Delivery</text>
  </g>
  <g font-size="17" fill="#6B6158" text-anchor="middle">
    <text x="236" y="760">row level security per room</text>
    <text x="620" y="760">realtime presence</text>
    <text x="1004" y="760">member media and avatars</text>
    <text x="1388" y="760">transactional email only</text>
    <text x="1776" y="760">letters, own multi-brand publisher</text>
  </g>

  <text x="60" y="832" font-size="19" fill="#8A7E72">Snapshot: 3 October 2026. The app is in active build, so this is dated rather than definitive.</text>
  <text x="60" y="862" font-size="19" fill="#8A7E72">Left of the gate needs no account. Right of it, every surface is a room you have been let into.</text>
</svg>
